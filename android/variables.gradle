ext {
    // minSdk 24 (Android 7.0) is required by @capacitor/camera 8.2's native
    // dependency io.ionic.libs:ioncamera-android. Drops Android 6.0 (API 23).
    minSdkVersion = 24
    // compileSdk 36 is required by androidx.core 1.17.0 (pulled in transitively
    // by Capacitor 8.4). Only the compile target is bumped — targetSdk stays 35
    // so we don't opt into Android 16 runtime behavior changes. AGP 8.11.2 (see
    // build.gradle) supports compileSdk 36, so no Gradle/AGP upgrade is needed.
    compileSdkVersion = 36
    targetSdkVersion = 35
    androidxActivityVersion = '1.8.0'
    androidxAppCompatVersion = '1.6.1'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.12.0'
    androidxFragmentVersion = '1.6.2'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.9.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.1.5'
    androidxEspressoCoreVersion = '3.5.1'
    // CameraX 1.5.x requires newer Android Gradle Plugin than this project uses (8.3.2).
    // Pin to 1.4.x until AGP is upgraded.
    androidxCameraCamera2Version = '1.4.2'
    androidxCameraCoreVersion = '1.4.2'
    androidxCameraLifecycleVersion = '1.4.2'
    androidxCameraViewVersion = '1.4.2'
    cordovaAndroidVersion = '10.1.1'
}