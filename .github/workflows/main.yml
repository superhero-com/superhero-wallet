name: Build and deploy
on: [push, pull_request]
permissions: {}
env:
  APP_NAME: wallet
jobs:
  # The job id is a required status check on master
  main:
    runs-on: ubuntu-latest
    # Runs npm ci and Gradle, so no write token
    permissions:
      contents: read
    env:
      ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
      ETHERSCAN_API_KEY: "${{ github.ref == 'refs/heads/master' && secrets.ETHERSCAN_API_KEY_PROD || secrets.ETHERSCAN_API_KEY_DEV }}"
      ETHPLORER_API_KEY: ${{ secrets.ETHPLORER_API_KEY }}
      WALLET_CONNECT_PROJECT_ID: ${{ secrets.WALLET_CONNECT_PROJECT_ID }}
      TOKEN_SALES_URL_MAINNET: ${{ secrets.TOKEN_SALES_URL_MAINNET }}
      TOKEN_SALES_URL_TESTNET: ${{ secrets.TOKEN_SALES_URL_TESTNET }}
      # Chrome is only for the extension tests
      PUPPETEER_SKIP_DOWNLOAD: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 100
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties
            package-lock.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - name: Install app dependencies
        run: npm ci
      - name: Build Ionic Vue android app
        run: |
          npm run build:ionic
          npx cap sync android
      - name: Build android apk
        run: cd android && ./gradlew assembleDebug
      - run: |
          npm run build:web
          npm run build:extension
          npm run build-zip
          cp -r dist/web/root dist-stage
          mv dist-zip dist-stage/artifacts
          mv tests/pages/index.html dist-stage/artifacts/deeplink-test.html
          cp -r ./android/app/build/outputs/apk/debug ./dist-stage/artifacts/android
      - run: cp ./dist/web/root/index.html ./dist/web/root/404.html
      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/master'
        with:
          name: web
          path: dist/web/root
          # .well-known holds the app-link files
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: stage
          path: dist-stage
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy-production:
    name: Deploy to production
    needs: main
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: web
          path: dist/web/root
      - name: Check the app-link files
        run: test -s dist/web/root/.well-known/assetlinks.json && test -s dist/web/root/.well-known/apple-app-site-association
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/web/root
          cname: wallet.superhero.com

  release:
    name: Release
    needs: main
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: stage
          path: dist-stage
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Release ${{ github.ref }}
          files: ./dist-stage/artifacts/superhero-wallet-*
          fail_on_unmatched_files: true

  deploy-stage:
    name: Deploy to stage
    needs: main
    if: github.event_name == 'push' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: stage
          path: dist-stage
      # Slugs come from this job's own context, not from the build
      - uses: rlespinasse/github-slug-action@0e3299190dac9a700da92a90de4556116ea965ed # v5.7.1
      - uses: easingthemes/ssh-deploy@35647dbb6c84e9f4c4ff546acffbfe40e5650576 # v6.0.3
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGE_PRIVATE_KEY }}
          SOURCE: dist-stage/
          REMOTE_HOST: z52da5wt.xyz
          REMOTE_USER: root
          REMOTE_PORT: 2022
          TARGET: ${{ format('/data/{0}/{1}', env.APP_NAME, env.GITHUB_REF_SLUG_URL) }}

  comment:
    name: Link the stage deploy
    needs: main
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: rlespinasse/github-slug-action@0e3299190dac9a700da92a90de4556116ea965ed # v5.7.1
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HOST: ${{ format('{0}.{1}.z52da5wt.xyz', env.GITHUB_HEAD_REF_SLUG_URL, env.APP_NAME) }}
        run: |
          msg="Deployed to [$HOST](https://$HOST), [artifacts](https://$HOST/artifacts)"
          comments=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --jq '.[].body')
          if grep -qxF -- "$msg" <<< "$comments"; then
            echo "The PR already has this comment"
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$msg" > /dev/null
          fi
